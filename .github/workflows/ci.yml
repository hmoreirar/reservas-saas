name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          sudo systemctl start postgresql || sudo service postgresql start
          sudo -u postgres psql -c "CREATE ROLE runner WITH LOGIN PASSWORD 'runner' SUPERUSER;"
          sudo -u postgres createdb -O runner reservas_saas
      - name: Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: runner
          DB_PASSWORD: runner
          DB_NAME: reservas_saas
          DB_PORT: 5432
          JWT_SECRET: ci-secret
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build